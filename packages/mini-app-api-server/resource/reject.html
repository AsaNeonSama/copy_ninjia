:root,
[data-theme="light"],
[data-theme="dark"] {
  --border-w: 2px;
  --border-w-sm: 1.5px;
  --radius-xs: 3px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --shadow-xs: 2px 2px 0 var(--shadow-ink);
  --shadow-sm: 3px 3px 0 var(--shadow-ink);
  --shadow-md: 4px 4px 0 var(--shadow-ink);
  --shadow-lg: 6px 6px 0 var(--shadow-ink);
  --shadow-accent: 3px 3px 0 var(--accent);
  --skew-btn: -9deg;
  --skew-chip: -8deg;
  --skew-chip-counter: 8deg;
  --clip-chamfer: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  --clip-chamfer-inner: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  --clip-dogear: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  --clip-dogear-inner: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
  --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --ease-brutal: cubic-bezier(0.2, 0.9, 0.25, 1);
  --ease-snap: cubic-bezier(0.16, 1, 0.3, 1);
  --press-duration: 90ms;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-anchor: none;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px);
  background-size: 16px 16px;
  background-position: 0 0;
  color: var(--text);
  padding: 10px 10px calc(36px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 120ms var(--ease-brutal), color 120ms var(--ease-brutal);
}

.cf-error-page[hidden] {
  display: none;
}

.cf-error-page {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow-x: hidden;
  overflow-y: auto;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px);
  background-size: 16px 16px;
  color: var(--text);
  line-height: 1.5;
  padding: 20px 22px 36px;
}

.cf-error-container {
  --cf-card-skew: -2deg;
  --cf-card-pt: 24px;
  --cf-card-px: 22px;
  max-width: 880px;
  margin: 12px auto 0;
  padding: var(--cf-card-pt) var(--cf-card-px) 24px;
  background: var(--card);
  border: var(--border-w) solid var(--border-strong);
  border-top: 6px solid var(--danger);
  border-radius: 3px 12px 3px 12px;
  box-shadow: var(--shadow-lg);
  transform: skewX(var(--cf-card-skew));
}

[data-theme="dark"] .cf-error-container {
  background: #1b1f30;
  border-color: var(--border-strong);
  border-top: 6px solid var(--danger);
}

@media (max-width: 560px) {
  .cf-error-page {
    padding: 12px 18px 28px;
  }

  .cf-error-container {
    --cf-card-skew: -1.25deg;
    --cf-card-pt: 18px;
    --cf-card-px: 14px;
    margin-top: 4px;
    padding: var(--cf-card-pt) var(--cf-card-px) 18px;
  }
}

.cf-header {
  margin: calc(var(--cf-card-pt) * -1) calc(var(--cf-card-px) * -1) 20px;
  padding: 18px var(--cf-card-px) 16px;
  background: var(--surface-elevated);
  border-bottom: var(--border-w) solid var(--border);
  border-radius: 1px 10px 0 0;
}

[data-theme="dark"] .cf-header {
  background: #232940;
}

.cf-title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 8px;
  transform: skewX(calc(var(--cf-card-skew) * -1));
}

.cf-main-title {

  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.03em;
  text-transform: uppercase;
}

.cf-code-pill {

  background: var(--brutal-yellow);

}

}

.cf-node-title {

  font-weight: 800;
  color: var(--text);

.cf-node-state {

}

}

}

.cf-detail-col > p {

.cf-reason-box {

.cf-sep {

  font-weight: 900;

          deniedNodeClientTitle: "Zaako's Browser",
          deniedNodeClientState: "Working",
          deniedNodeGatewaySub: "Access Gateway",
          deniedNodeGatewayTitle: "Auth Guard",
          deniedNodeGatewayState: (status) => `${status} Denied`,
          deniedNodeOriginSub: "Origin Service",
          deniedNodeOriginState: "Protected",
          deniedWhatHappenedTitle: "What happened, Zaako?",
          deniedWhatHappenedDesc: "This endpoint enforces strict Telegram WebApp signature verification and administrator access control. The request a Zaako like you just sent failed policy validation and got kicked right out.",

              `3 consecutive wrong tries! SuperAdmin ID is locked out for 30 minutes${remMin !== undefined ? ` (~${remMin} min left)` : ""}, Zaako.`,

      const nav = typeof navigator !== "undefined" ? navigator : window?.navigator;

      function matchSupportedLang(tag) {
        const normalized = String(tag || "").trim().toLowerCase();
        return SUPPORTED_LANGS.find((lang) => normalized.startsWith(lang));
      }

      function detectBrowserDefaultLanguage() {
        if (Array.isArray(nav?.languages)) {
          for (const item of nav.languages) {
            const matched = matchSupportedLang(item);
            if (matched) return matched;
          }
        }
        return matchSupportedLang(nav?.language ?? "zh") || "zh";
      }

      const locale = LOCALES[detectBrowserDefaultLanguage()];
      if (document.documentElement) document.documentElement.lang = locale.htmlLang;
      document.title = locale.appTitle;

      function serverNotice(locale, rawCode, params) {
        const code = String(rawCode || "").replace(/^\[[A-Z0-9_]+\]\s*/u, "").trim();
        const noticeKey = Object.hasOwn(NOTICE_CODE_ALIASES, code) ? NOTICE_CODE_ALIASES[code] : code;
        const entry = Object.hasOwn(locale.notices, noticeKey) ? locale.notices[noticeKey] : undefined;
        if (typeof entry === "string") return entry;
        if (typeof entry === "function") {
          const remMin =
            typeof params?.remainingMinutes === "number" && Number.isFinite(params.remainingMinutes)
              ? params.remainingMinutes
              : undefined;
          return entry(code, remMin);
        }
        return code;
      }

      function deniedPolicyReason(locale, code, fallbackError, params) {
        const upper = String(code || "").toUpperCase();
        const byCode = serverNotice(locale, upper, params);
        return byCode !== upper ? byCode : serverNotice(locale, fallbackError || code, params);
      }

      function extractTelegramInitData() {
        const tgInitData = window?.Telegram?.WebApp?.initData;
        if (typeof tgInitData === "string" && tgInitData.length > 0) return tgInitData;
        const loc = typeof location !== "undefined" ? location : window?.location;
        if (loc) {
          const fromQuery = new URLSearchParams(loc.search || "").get("tgWebAppData");
          if (fromQuery) return fromQuery;
          const hashStr = loc.hash || "";
          const fromHash = new URLSearchParams(hashStr.startsWith("#") ? hashStr.slice(1) : hashStr).get("tgWebAppData");
          if (fromHash) return fromHash;
        }
        try {
          const rawParams = window?.sessionStorage?.getItem("__telegram__initParams");
          if (rawParams) {
            const cached = JSON.parse(rawParams)?.tgWebAppData;
            if (typeof cached === "string" && cached.length > 0) return cached;
          }
        } catch {}
        return "";
      }

      function formatUtcTimestamp() {
        return `${new Date().toISOString().slice(0, 19).replace("T", " ")} UTC`;
      }

      function readBodyData(camelKey, attrName) {
        const body = document.body;
        if (!body) return "";
        const fromDataset = body.dataset?.[camelKey];
        if (typeof fromDataset === "string" && fromDataset.length > 0) return fromDataset;
        const fromAttr = body.getAttribute?.(attrName);
        return typeof fromAttr === "string" && fromAttr.length > 0 ? fromAttr : "";
      }

      function readServerDiag(fallbackError) {
        const loc = typeof location !== "undefined" ? location : window?.location;
        const rawStatus = Number(readBodyData("status", "data-status"));
        const status = Number.isInteger(rawStatus) && rawStatus > 0 ? rawStatus : 403;
        const code = readBodyData("code", "data-code") || "ACCESS_DENIED";
        const error = readBodyData("error", "data-error") || fallbackError;
        const requestId = readBodyData("requestId", "data-request-id") || "0000000000000000";
        const timestamp = readBodyData("timestamp", "data-timestamp") || formatUtcTimestamp();
        const clientIp = readBodyData("clientIp", "data-client-ip") || "127.0.0.1";
        const host = readBodyData("host", "data-host") || loc?.host || "localhost";
        const path = readBodyData("path", "data-path") || loc?.pathname || "/";
        const rawRem = readBodyData("remainingMinutes", "data-remaining-minutes");
        const parsedRem = rawRem !== "" ? Number(rawRem) : NaN;
        return {
          status, code, error, requestId, timestamp, clientIp, host, path,
          ...(Number.isFinite(parsedRem) ? { remainingMinutes: parsedRem } : {}),
        };
      }

      function clearStoredSession() {
        try { window?.localStorage?.removeItem(SESSION_STORAGE_KEY); } catch {}
        try { window?.sessionStorage?.removeItem(SESSION_STORAGE_KEY); } catch {}
      }

      function readStoredSessionToken() {
        let raw = null;
        try {
          raw = window?.localStorage?.getItem(SESSION_STORAGE_KEY) ?? window?.sessionStorage?.getItem(SESSION_STORAGE_KEY) ?? null;
        } catch { raw = null; }
        if (!raw) return "";
        try {
          const parsed = JSON.parse(String(raw).trim());
          if (
            parsed && typeof parsed === "object" && typeof parsed.token === "string" &&
            /^[0-9a-f]{64}$/i.test(parsed.token) && typeof parsed.expiresAt === "number" &&
            Number.isFinite(parsed.expiresAt) && parsed.expiresAt > Date.now()
          ) {
            return parsed.token;
          }
        } catch {}
        clearStoredSession();
        return "";
      }

      function syncRefreshedSession(res) {
        const refreshedToken = String(res.headers?.get?.("x-mini-app-session") || "").trim();
        if (!/^[0-9a-f]{64}$/i.test(refreshedToken)) return;
        const nowMs = Date.now();
        const rawExpiresAt = Number(String(res.headers?.get?.("x-mini-app-session-expires-at") || "").trim());
        const serverDateMs = Date.parse(res.headers?.get?.("date") || "");
        const localExpiresAt = Number.isFinite(serverDateMs) ? rawExpiresAt - (serverDateMs - nowMs) : rawExpiresAt;
        const expiresAt = localExpiresAt > nowMs ? localExpiresAt : nowMs + 2700000;
        const serialized = JSON.stringify({ token: refreshedToken, expiresAt });
        try { window?.localStorage?.setItem(SESSION_STORAGE_KEY, serialized); } catch {}
        try { window?.sessionStorage?.setItem(SESSION_STORAGE_KEY, serialized); } catch {}
      }

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }

      function renderDenied(diag, locale) {
        setText("cf-denied-title", locale.deniedTitle);
        setText("cf-code-pill-text", `HTTP ${diag.status} · ${diag.code}`);
        setText("cf-denied-desc", locale.deniedDescription);
        setText("cf-timestamp", diag.timestamp);
        setText("cf-node-client-sub", locale.deniedNodeClientSub);
        setText("cf-node-client-title", locale.deniedNodeClientTitle);
        setText("cf-node-client-state", locale.deniedNodeClientState);
        setText("cf-node-gateway-sub", locale.deniedNodeGatewaySub);
        setText("cf-node-gateway-title", locale.deniedNodeGatewayTitle);
        setText("cf-node-gateway-state", locale.deniedNodeGatewayState(diag.status));
        setText("cf-node-origin-sub", locale.deniedNodeOriginSub);
        setText("cf-node-origin-title", diag.host);
        setText("cf-node-origin-state", locale.deniedNodeOriginState);
        setText("cf-what-happened-title", locale.deniedWhatHappenedTitle);
        setText("cf-what-happened-desc", locale.deniedWhatHappenedDesc);
        setText("cf-policy-label", `${locale.deniedPolicyDetailLabel(diag.code)}:`);
        setText("cf-policy-reason", deniedPolicyReason(locale, diag.code, diag.error, diag));
        setText("cf-what-can-i-do-title", locale.deniedWhatCanIDoTitle);
        setText("cf-what-can-i-do-desc", locale.deniedWhatCanIDoDesc);
        setText("cf-req-id", diag.requestId);
        setText("cf-client-ip", diag.clientIp);
        setText("cf-host", diag.host);
        setText("cf-path", diag.path);
        const pageEl = document.getElementById("cf-error-page");
        if (pageEl) {
          pageEl.hidden = false;
          pageEl.removeAttribute?.("hidden");
        }
      }

      async function boot() {
        const serverDiag = readServerDiag(locale.deniedDescription);
        const initData = extractTelegramInitData();
        if (!initData) {
          clearStoredSession();
          renderDenied(serverDiag, locale);
          return;
        }
        const token = readStoredSessionToken();
        const headers = {
          Accept: "application/json",
          "X-Telegram-Init-Data": initData,
          ...(token ? { "X-Mini-App-Session": token } : {}),
        };
        try {
          const res = await fetch("./api/auth/precheck", {
            method: "GET", credentials: "same-origin", cache: "no-store", headers,
          });
          const loc = typeof location !== "undefined" ? location : window?.location;
          if (res.ok) {
            syncRefreshedSession(res);
            const nowMs = Date.now();
            let canReload = true;
            try {
              if (window?.sessionStorage) {
                const rawTs = window.sessionStorage.getItem(RELOAD_GUARD_KEY);
                const parsedTs = rawTs ? Number(rawTs) : NaN;
                if (Number.isFinite(parsedTs) && parsedTs > 0 && nowMs - parsedTs >= 0 && nowMs - parsedTs < 5000) {
                  canReload = false;
                }
                if (canReload) window.sessionStorage.setItem(RELOAD_GUARD_KEY, String(nowMs));
              }
            } catch { canReload = false; }
            if (!canReload) {
              renderDenied({ ...serverDiag, status: 403, code: "ACCESS_DENIED", error: locale.deniedDescription }, locale);
              return;
            }
            loc?.reload?.();
            return;
          }
          let payload = null;
          try { payload = await res.json(); } catch { payload = null; }
          const rec = payload && typeof payload === "object" ? payload : {};
          const str = (key, fallbackVal) => (typeof rec[key] === "string" && rec[key].length > 0 ? rec[key] : fallbackVal);
          const status = typeof rec.status === "number" ? rec.status : res.status || 403;
          const precheckDiag = {
            status,
            code: str("code", `HTTP_${res.status || 403}`),
            error: str("error", "MISSING_INIT_DATA"),
            requestId: str("requestId", res.headers?.get?.("x-request-id") || serverDiag.requestId),
            timestamp: str("timestamp", formatUtcTimestamp()),
            clientIp: str("clientIp", serverDiag.clientIp),
            host: str("host", loc?.host || serverDiag.host),
            path: str("path", "/api/auth/precheck"),
            ...(typeof rec.remainingMinutes === "number" && Number.isFinite(rec.remainingMinutes)
              ? { remainingMinutes: rec.remainingMinutes }
              : {}),
          };
          clearStoredSession();
          renderDenied(precheckDiag, locale);
        } catch {
          renderDenied(serverDiag, locale);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => { void boot(); }, { once: true });
        return undefined;
      }
      return boot();
    })();
  </script>
</head>
<body>
  <div class="cf-error-page" id="cf-error-page" hidden>
    <div class="cf-error-container">
      <div class="cf-header">
        <div class="cf-title-row">
          <span class="cf-main-title" id="cf-denied-title"></span>
          <span class="cf-code-pill"><span id="cf-code-pill-text"></span></span>
        </div>
        <p class="cf-subtitle" id="cf-denied-desc"></p>
        <div class="cf-timestamp" id="cf-timestamp"></div>
      </div>

      <div class="cf-status-band">
        <div class="cf-status-inner">
          <div class="cf-node">
            <div class="cf-node-content">
              <div class="cf-node-icon ok"><span>✓</span></div>
              <div class="cf-node-meta">
                <div class="cf-node-sub" id="cf-node-client-sub"></div>
                <div class="cf-node-title" id="cf-node-client-title"></div>
                <div class="cf-node-state ok" id="cf-node-client-state"></div>
              </div>
            </div>
          </div>

          <div class="cf-node">
            <div class="cf-node-content">
              <div class="cf-node-icon err"><span>✕</span></div>
              <div class="cf-node-meta">
                <div class="cf-node-sub" id="cf-node-gateway-sub"></div>
                <div class="cf-node-title" id="cf-node-gateway-title"></div>
                <div class="cf-node-state err" id="cf-node-gateway-state"></div>
              </div>
            </div>
          </div>

          <div class="cf-node">
            <div class="cf-node-content">
              <div class="cf-node-icon ok"><span>✓</span></div>
              <div class="cf-node-meta">
                <div class="cf-node-sub" id="cf-node-origin-sub"></div>
                <div class="cf-node-title" id="cf-node-origin-title"></div>
                <div class="cf-node-state ok" id="cf-node-origin-state"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cf-details-grid">
        <div class="cf-detail-col">
          <h2 id="cf-what-happened-title"></h2>
          <p id="cf-what-happened-desc"></p>
          <div class="cf-reason-box">
            <div class="cf-reason-content">
              <strong id="cf-policy-label"></strong> <span id="cf-policy-reason"></span>
            </div>
          </div>
        </div>
        <div class="cf-detail-col">
          <h2 id="cf-what-can-i-do-title"></h2>
          <p id="cf-what-can-i-do-desc"></p>
        </div>
      </div>

      <div class="cf-footer">
        <span>Request ID: <strong><span id="cf-req-id"></span></strong></span>
        <span class="cf-sep">•</span>
        <span>Client IP: <strong><span id="cf-client-ip"></span></strong></span>
        <span class="cf-sep">•</span>
        <span>Host: <strong><span id="cf-host"></span></strong></span>
        <span class="cf-sep">•</span>
        <span>Path: <strong><span id="cf-path"></span></strong></span>
      </div>
    </div>
  </div>
</body>
